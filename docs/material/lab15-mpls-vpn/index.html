<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Guía MPLS VPN</title>
<meta name="description" content="Laboratorio N°15 ARY6112 — Guía interactiva paso a paso para implementar MPLS VPN de Capa 3 y Capa 2.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f5f7; --surface:#ffffff; --surface-2:#eef0f3; --border:#d9dde3;
  --text:#1b1f24; --muted:#5d6672; --accent:#1f5fbf; --accent-soft:#e3ecfa;
  --ok:#1f8a4c; --ok-soft:#e2f4ea; --warn:#a85d00; --warn-soft:#fdf0dc;
  --bad:#b3261e; --bad-soft:#fbe4e2;
  --code-bg:#0f1720; --code-text:#e6edf3; --code-cmt:#7d8b99; --code-kw:#7cc4ff;
  --pe:#6b3fb5; --p:#1f5fbf; --ce:#2f8f5b; --ce2:#c0392b; --host:#5d6672;
  --reg-l3:#e7f3e2; --reg-l3-b:#8cc27a; --reg-l2:#f8e3e3; --reg-l2-b:#d98080; --reg-bb:#fdf4d6; --reg-bb-b:#e5b94a;
  --dim:.18;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1216; --surface:#171b21; --surface-2:#1f252d; --border:#2c333d;
    --text:#e6e9ee; --muted:#9aa4b1; --accent:#6ea8ff; --accent-soft:#1a2a44;
    --ok:#4cc38a; --ok-soft:#14301f; --warn:#f0a648; --warn-soft:#33240f;
    --bad:#ff7b72; --bad-soft:#3a1714;
    --code-bg:#0a0e13; --code-text:#e6edf3; --code-cmt:#6c7a89; --code-kw:#7cc4ff;
    --pe:#a98bea; --p:#6ea8ff; --ce:#5cc98c; --ce2:#ff8a80; --host:#9aa4b1;
    --reg-l3:#16261a; --reg-l3-b:#3f7a45; --reg-l2:#2a1617; --reg-l2-b:#8a4444; --reg-bb:#2a2410; --reg-bb-b:#8a7228;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1216; --surface:#171b21; --surface-2:#1f252d; --border:#2c333d;
  --text:#e6e9ee; --muted:#9aa4b1; --accent:#6ea8ff; --accent-soft:#1a2a44;
  --ok:#4cc38a; --ok-soft:#14301f; --warn:#f0a648; --warn-soft:#33240f;
  --bad:#ff7b72; --bad-soft:#3a1714;
  --code-bg:#0a0e13; --code-text:#e6edf3; --code-cmt:#6c7a89; --code-kw:#7cc4ff;
  --pe:#a98bea; --p:#6ea8ff; --ce:#5cc98c; --ce2:#ff8a80; --host:#9aa4b1;
  --reg-l3:#16261a; --reg-l3-b:#3f7a45; --reg-l2:#2a1617; --reg-l2-b:#8a4444; --reg-bb:#2a2410; --reg-bb-b:#8a7228;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.55 "IBM Plex Sans",system-ui,sans-serif;}
code,pre,.mono{font-family:"JetBrains Mono",ui-monospace,monospace}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--accent)}

/* ---------- header ---------- */
header.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--border);}
.top-inner{max-width:1500px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;line-height:1.2;margin-right:auto}
.brand b{font-size:16px}
.brand span{font-size:12px;color:var(--muted)}
.modes{display:flex;background:var(--surface-2);border:1px solid var(--border);border-radius:8px;padding:3px}
.modes button{border:0;background:transparent;padding:5px 12px;border-radius:6px;font-size:13px;font-weight:500;color:var(--muted)}
.modes button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.icon-btn{border:1px solid var(--border);background:var(--surface);border-radius:8px;padding:6px 10px;font-size:13px}
.progress{height:4px;background:var(--surface-2)}
.progress i{display:block;height:100%;background:var(--ok);width:0;transition:width .3s}

/* ---------- layout ---------- */
.layout{max-width:1500px;margin:0 auto;padding:16px;display:grid;grid-template-columns:250px minmax(0,1fr) minmax(0,600px);gap:16px;align-items:start}
nav.steps{position:sticky;top:76px;max-height:calc(100vh - 92px);overflow:auto;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:10px}
.phase{margin-bottom:8px}
.phase-h{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:8px 8px 4px;display:flex;gap:6px;align-items:center}
.phase-h .dot{width:8px;height:8px;border-radius:50%}
.step-link{display:flex;gap:8px;align-items:flex-start;width:100%;text-align:left;border:0;background:transparent;padding:6px 8px;border-radius:7px;font-size:13.5px;color:var(--text)}
.step-link:hover{background:var(--surface-2)}
.step-link[aria-current="step"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.step-link .n{flex:none;width:30px;font-family:"JetBrains Mono",monospace;font-size:11.5px;color:var(--muted);padding-top:2px}
.step-link .ck{flex:none;margin-left:auto;color:var(--ok);font-size:12px;visibility:hidden}
.step-link.done .ck{visibility:visible}

main{min-width:0}
.card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:20px 22px;margin-bottom:16px}
.eyebrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-bottom:6px}
.chip{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px;border:1px solid var(--border);background:var(--surface-2);color:var(--muted)}
h1.step-title{font-size:24px;line-height:1.25;margin:0 0 12px}
h2.sec{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:22px 0 10px}
.lead p{margin:0 0 10px}
.lead ul{margin:0 0 10px;padding-left:20px}
.lead code,.callout code,td code{background:var(--surface-2);padding:1px 5px;border-radius:4px;font-size:.9em}

.callout{border-radius:10px;padding:12px 14px;margin:12px 0;font-size:14px;border-left:4px solid}
.callout b.t{display:block;margin-bottom:3px}
.callout.why{background:var(--accent-soft);border-color:var(--accent)}
.callout.warn{background:var(--warn-soft);border-color:var(--warn)}
.callout.tip{background:var(--ok-soft);border-color:var(--ok)}
.callout p{margin:0 0 6px}.callout p:last-child{margin:0}
.callout ul{margin:4px 0 0;padding-left:20px}

/* tabs + code */
.devtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.devtabs button{border:1px solid var(--border);background:var(--surface);border-radius:8px;padding:5px 12px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px}
.devtabs button .sw{width:9px;height:9px;border-radius:3px}
.devtabs button[aria-selected="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.devtabs button.copied-all{opacity:.6}
.codebox{position:relative;background:var(--code-bg);color:var(--code-text);border-radius:10px;overflow:hidden}
.codebox .bar{display:flex;align-items:center;justify-content:space-between;padding:7px 12px;border-bottom:1px solid #ffffff14;font-size:12px;color:var(--code-cmt)}
.codebox .bar b{color:var(--code-text);font-weight:600}
.copy{border:1px solid #ffffff26;background:#ffffff10;color:var(--code-text);border-radius:6px;padding:3px 10px;font-size:12px}
.copy.ok{background:#1f8a4c;border-color:#1f8a4c}
pre.code{margin:0;padding:12px 14px;overflow:auto;font-size:13px;line-height:1.6;max-height:520px}
pre.code .c{color:var(--code-cmt);font-style:italic}
pre.code .k{color:var(--code-kw)}
pre.code .hl{background:#f0a64830;border-radius:3px;outline:1px solid #f0a64880}
.blocknote{font-size:13px;color:var(--muted);margin:8px 2px 0}

.verify{border:1px solid var(--border);border-radius:10px;margin-bottom:10px;overflow:hidden}
.verify .vh{display:flex;gap:10px;align-items:center;padding:10px 12px;background:var(--surface-2);flex-wrap:wrap}
.verify .vh .dev{font-weight:700;font-size:12px;padding:2px 8px;border-radius:6px;background:var(--surface);border:1px solid var(--border)}
.verify .vh code{font-size:13px;flex:1;min-width:180px}
.verify .vh .copy{background:var(--surface);border-color:var(--border);color:var(--text)}
.verify .vb{padding:10px 12px;font-size:13.5px}
.verify details summary{cursor:pointer;color:var(--accent);font-size:13px;margin-top:4px}
.verify pre{background:var(--code-bg);color:var(--code-text);padding:10px 12px;border-radius:8px;font-size:12.5px;overflow:auto;margin:8px 0 0}

table.t{width:100%;border-collapse:collapse;font-size:13.5px;margin:8px 0 12px}
table.t th,table.t td{border-bottom:1px solid var(--border);padding:6px 8px;text-align:left;vertical-align:top}
table.t th{font-size:12px;color:var(--muted);font-weight:600;background:var(--surface-2)}
.tablewrap{overflow-x:auto}

.navbtns{display:flex;gap:10px;justify-content:space-between;align-items:center;flex-wrap:wrap;margin-top:22px;padding-top:16px;border-top:1px solid var(--border)}
.btn{border:1px solid var(--border);background:var(--surface);border-radius:9px;padding:9px 16px;font-weight:600;font-size:14px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.done{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.btn:disabled{opacity:.4;cursor:default}
.kbd{font-size:12px;color:var(--muted)}

/* ---------- topology panel ---------- */
aside.topo{position:sticky;top:76px}
.topo .card{padding:12px}
.topo-h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:0 4px 6px;flex-wrap:wrap}
.topo-h b{font-size:13px}
.topo-h .hint{font-size:12px;color:var(--muted)}
svg.net{width:100%;height:auto;display:block;user-select:none}
aside.topo.big{position:fixed;inset:12px;z-index:50;overflow:auto}
aside.topo.big .card{min-height:100%;box-shadow:0 10px 40px rgba(0,0,0,.35)}
aside.topo.big svg.net{max-height:calc(100vh - 170px)}
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40}
svg.net .region rect{stroke-width:1.5;stroke-dasharray:6 4}
svg.net .region text{font-size:14px;font-weight:700;fill:var(--muted)}
svg.net .link line,svg.net .link path{stroke:var(--muted);stroke-width:2.2;fill:none}
svg.net .link text{font-size:12px;fill:var(--muted);font-family:"JetBrains Mono",monospace}
svg.net .node{cursor:pointer}
svg.net .node .icon .hi{fill:#fff;opacity:.22}
svg.net .node .icon .lo{fill:#000;opacity:.25}
svg.net .node .icon .ar{stroke:#fff;stroke-width:1.6;fill:none;stroke-linecap:round}
svg.net .node .icon .scr{fill:#dbe8f7}
svg.net .node .icon .edge{stroke:#00000040;stroke-width:1;fill:none}
svg.net .node text.name{font-size:15px;font-weight:700;fill:var(--text);text-anchor:middle}
svg.net .node text.sub{font-size:12px;fill:var(--muted);text-anchor:middle;font-family:"JetBrains Mono",monospace}
svg.net .node text.ic{font-size:11px;font-weight:700;fill:#fff;text-anchor:middle;dominant-baseline:central;pointer-events:none}
svg.net .overlay{opacity:0;transition:opacity .35s}
svg.net .overlay.on{opacity:1}
svg.net .overlay path{fill:none;stroke-width:3;stroke-dasharray:8 6}
svg.net .overlay text{font-size:13px;font-weight:700}
svg.net.focus .node:not(.on),svg.net.focus .link:not(.on){opacity:var(--dim)}
svg.net .node,svg.net .link{transition:opacity .3s}
svg.net .link.on line,svg.net .link.on path{stroke:var(--accent);stroke-width:3.2}
svg.net .node.on .icon{filter:drop-shadow(0 0 5px var(--accent))}
svg.net .node.sel .ring{opacity:1}
svg.net .ring{opacity:0;fill:none;stroke:var(--accent);stroke-width:2.5;stroke-dasharray:4 3}
#pkt{pointer-events:none}
#pkt rect{fill:var(--warn);}
#pkt text{font-size:11px;font-weight:700;fill:#1b1f24;font-family:"JetBrains Mono",monospace;text-anchor:middle;dominant-baseline:central}
.anim-bar[hidden]{display:none}
.anim-bar{display:flex;gap:8px;align-items:center;margin:8px 4px 0;flex-wrap:wrap}
.anim-bar .lbl{font-size:12.5px;color:var(--muted);flex:1;min-width:160px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin:8px 4px 0}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:10px;height:10px;border-radius:50%;display:inline-block}

/* device view */
.devpick{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.devpick button{border:1px solid var(--border);background:var(--surface);border-radius:8px;padding:5px 11px;font-size:13px;font-weight:600}
.devpick button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.devsec{margin-bottom:18px}
.devsec h3{font-size:14px;margin:0 0 6px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.devsec h3 a{font-size:12px;font-weight:500}

@media (max-width:1250px){
  .layout{grid-template-columns:240px minmax(0,1fr)}
  aside.topo{grid-column:1 / -1;position:static;order:-1}
}
@media (max-width:820px){
  .layout{grid-template-columns:minmax(0,1fr);padding:12px 16px}
  nav.steps{position:static;max-height:none}
  nav.steps.collapsed .phase{display:none}
  .card{padding:16px}
  h1.step-title{font-size:20px}
}
.navtoggle{display:none;width:100%;margin-bottom:6px}
@media (max-width:820px){.navtoggle{display:block}}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="top-inner">
    <div class="brand"><b>Lab N°15 · MPLS VPN Capa 3 y Capa 2</b><span>ARY6112 · Guía interactiva paso a paso</span></div>
    <div class="modes" role="group" aria-label="Modo de vista">
      <button id="mStep" aria-pressed="true">Paso a paso</button>
      <button id="mDev" aria-pressed="false">Por equipo</button>
    </div>
    <button class="icon-btn" id="themeBtn" title="Cambiar tema">◐ Tema</button>
    <button class="icon-btn" id="resetBtn" title="Borrar progreso">↺ Reiniciar</button>
  </div>
  <div class="progress"><i id="progBar"></i></div>
</header>

<div class="layout">
  <nav class="steps" id="stepsNav" aria-label="Pasos">
    <button class="btn navtoggle" id="navToggle">☰ Ver lista de pasos</button>
    <div id="stepsList"></div>
  </nav>

  <main id="main"></main>

  <aside class="topo">
    <div class="card">
      <div class="topo-h"><b>Topología</b><span class="hint">Clic en un equipo para ver toda su configuración</span><button class="icon-btn" id="bigBtn">⤢ Ampliar</button></div>
      <svg class="net" id="net" viewBox="0 0 1040 610" role="img" aria-label="Topología del laboratorio"></svg>
      <div class="anim-bar" id="animBar" hidden>
        <button class="btn primary" id="playBtn">▶ Animar paquete</button>
        <span class="lbl" id="animLbl"></span>
      </div>
      <div class="legend">
        <span><i style="background:var(--p)"></i>Router P (core)</span>
        <span><i style="background:var(--pe)"></i>Router PE (borde)</span>
        <span><i style="background:var(--ce)"></i>Router CE ENARSI (L3)</span>
        <span><i style="background:var(--ce2)"></i>Router ENCOR (L2)</span>
        <span><i style="background:var(--host)"></i>PC / Switch</span>
      </div>
    </div>
  </aside>
</div>

<script>
/* =====================================================================
   DATOS DE LA TOPOLOGÍA
   ===================================================================== */
const NODES = {
  "PC-ENARSI1":{x:50, y:130, role:"host", sub:".7", info:"172.16.10.7/28 · gw 172.16.10.1"},
  "CE1":{x:180,y:130, role:"ce", sub:"AS 65100", info:"e0/0 172.16.10.1/28 · e0/3 172.16.11.1/24"},
  "PE1":{x:345,y:130, role:"pe", sub:"Lo0 11.11.11.11", info:"e0/0→PE2 · e0/1→P2 · e0/2→P1 · e0/3→CE1"},
  "P1": {x:520,y:130, role:"p",  sub:"Lo0 1.1.1.1", info:"e0/1→PE3 · e0/2→PE1"},
  "PE3":{x:695,y:130, role:"pe", sub:"Lo0 33.33.33.33", info:"e0/0→CE4 · e0/1→P1 · e0/2→P2 · e0/3→PE4"},
  "CE4":{x:860,y:130, role:"ce", sub:"AS 65200", info:"e0/0 172.16.34.4/24 · e0/1 172.16.40.4/28"},
  "PC-ENARSI2":{x:990,y:130, role:"host", sub:".9", info:"172.16.40.9/28 · gw 172.16.40.4"},
  "PE2":{x:345,y:330, role:"pe", sub:"Lo0 22.22.22.22", info:"e0/0→PE1 · e0/2→CE2 (AC) · e0/3→P2"},
  "P2": {x:520,y:330, role:"p",  sub:"Lo0 2.2.2.2", info:"e0/0→PE4 · e0/1→PE1 · e0/2→PE3 · e0/3→PE2"},
  "PE4":{x:695,y:330, role:"pe", sub:"Lo0 44.44.44.44", info:"e0/0→P2 · e0/2→CE3 (AC) · e0/3→PE3"},
  "PC-ENCOR1":{x:55, y:515, role:"host", sub:"DHCP", info:"e0/3 · cliente DHCP"},
  "R1": {x:190,y:515, role:"ce2", sub:"Área 10", info:"e0/3 192.168.10.1/29 · Multilink1 .1"},
  "CE2":{x:345,y:515, role:"ce2", sub:"DHCP srv", info:"Multilink1 192.168.12.2 · e0/2 192.168.23.2"},
  "CE3":{x:695,y:515, role:"ce2", sub:"DHCP srv", info:"e0/2 192.168.23.3 · e0/0 192.168.33.3/29"},
  "SWA":{x:800,y:515, role:"sw", sub:"VLAN 33", info:"e0/0→CE3 · e0/1-2 Po6 PAgP"},
  "SWB":{x:900,y:515, role:"sw", sub:"VLAN 33", info:"e0/1-2 Po6 PAgP · e0/3→PC"},
  "PC-ENCOR2":{x:990,y:515, role:"host", sub:"DHCP", info:"e0/3 · cliente DHCP (VLAN 33)"}
};
const LINKS = [
  ["PC-ENARSI1","CE1","172.16.10.0/28"],["CE1","PE1","172.16.11.0/24"],["PE1","P1","10.10.11.0/24"],
  ["P1","PE3","10.10.13.0/24"],["PE3","CE4","172.16.34.0/24"],["CE4","PC-ENARSI2","172.16.40.0/28"],
  ["PE1","PE2","10.10.21.0/24"],["PE1","P2","10.10.12.0/24"],["P2","PE3","10.10.23.0/24"],["PE3","PE4","10.10.34.0/24"],
  ["PE2","P2","10.10.22.0/24"],["P2","PE4","10.10.24.0/24"],
  ["PE2","CE2","AC e0/2"],["PE4","CE3","AC e0/2"],
  ["PC-ENCOR1","R1","192.168.10.0/29"],["R1","CE2","Multilink1 · 192.168.12.0/24"],
  ["CE3","SWA","192.168.33.0/29"],["SWA","SWB","Po6 PAgP"],["SWB","PC-ENCOR2","VLAN 33"]
];
const ROLE_COLOR = {p:"var(--p)",pe:"var(--pe)",ce:"var(--ce)",ce2:"var(--ce2)",host:"var(--host)",sw:"var(--host)"};
const BACKBONE = ["PE1","PE2","PE3","PE4","P1","P2"];
const linkId = (a,b)=>"L_"+[a,b].sort().join("__");

/* Animaciones de paquetes: [desde, hasta, etiqueta mostrada] */
const ANIMS = {
  trace: {label:"Traceroute PE1 → 33.33.33.33 (una de las rutas ECMP)", hops:[
    ["PE1","P1","[2xx] IP"],["P1","PE3","IP · PHP"]],
    explain:"P1 asignó la etiqueta 2xx para 33.33.33.33. PE3 anunció implicit-null, por eso P1 quita la etiqueta (PHP) antes de entregar."},
  l3: {label:"PC-ENARSI1 → PC-ENARSI2 por MPLS VPN L3", hops:[
    ["PC-ENARSI1","CE1","IP"],["CE1","PE1","IP"],["PE1","P1","[2xx|3xx] IP"],["P1","PE3","[3xx] IP"],["PE3","CE4","IP"],["CE4","PC-ENARSI2","IP"]],
    explain:"Dos etiquetas: la externa (2xx de P1) lleva el paquete hasta PE3; la interna (3xx, etiqueta VPN asignada por PE3 vía MP-BGP) le dice a PE3 en qué VRF entregarlo."},
  l2: {label:"Trama de CE2 → CE3 por el pseudowire (VC 111)", hops:[
    ["CE2","PE2","Trama Eth"],["PE2","P2","[5xx|6xx] Eth"],["P2","PE4","[6xx] Eth"],["PE4","CE3","Trama Eth"]],
    explain:"La trama Ethernet completa viaja encapsulada. Externa 5xx (de P2) hacia PE4; interna 6xx = etiqueta del VC 111 asignada por PE4 mediante LDP dirigido."},
  e2e: {label:"PC-ENCOR1 → PC-ENCOR2 (OSPF área 10 sobre el túnel L2)", hops:[

 { id:"2.1", title:"CEF y rango de etiquetas por router",

   why:`Con rangos distintos, al leer una etiqueta sabes quién la generó. En MPLS cada router asigna etiquetas <b>localmente</b> y las anuncia a sus vecinos LDP: la etiqueta que ves en un enlace la eligió el <b>router de aguas abajo</b>.`,
   warn:`<b>Orden:</b> configura <code>mpls label range</code> <u>antes</u> de activar LDP. Si lo haces después, IOS solo lo aplica tras <code>do wr</code> + <code>reload</code>.`,

{ id:"f3", title:"Fase 3 · MPLS VPN Capa 3 (ENARSI)", color:"var(--ce)", steps:[
 { id:"3.1", title:"Crear la VRF ENARSI en PE1 y PE3 (RD y RT)",
   focus:["PE1","PE3"], overlays:[],
   lead:`<p>Una <b>VRF</b> es una tabla de rutas independiente dentro del PE para un cliente.</p>
<div class="tablewrap"><table class="t"><tr><th>PE</th><th>RD</th><th>RT export</th><th>RT import</th></tr>
<tr><td>PE1 (ENARSI 1)</td><td><code>65100:1</code></td><td><code>65100:1</code></td><td><code>65200:3</code></td></tr>
<tr><td>PE3 (ENARSI 2)</td><td><code>65200:3</code></td><td><code>65200:3</code></td><td><code>65100:1</code></td></tr></table></div>`,
   why:`<ul><li><b>RD (Route Distinguisher):</b> se antepone al prefijo para hacerlo único en BGP VPNv4 (172.16.10.0 → 65100:1:172.16.10.0). No decide nada sobre importación.</li>
<li><b>RT (Route Target):</b> comunidad extendida que decide <b>quién importa qué</b>. Lo que un PE exporta debe coincidir con lo que el otro importa: <b>cruzados</b>.</li></ul>`,
   warn:`<b>Error común:</b> si el RT que importa un PE no es exactamente el que exporta el otro, las rutas viajan por VPNv4 pero <u>nunca entran</u> a la VRF remota. Revisa siempre que queden cruzados.`,
   blocks:[
    {dev:"PE1",code:`conf t
ip vrf ENARSI
 rd 65100:1
 route-target export 65100:1
 route-target import 65200:3
end`},
    {dev:"PE3",code:`conf t
ip vrf ENARSI
 rd 65200:3
 route-target export 65200:3
 route-target import 65100:1
end`}],
   verify:[{dev:"PE1/PE3",cmd:"show ip vrf detail ENARSI",expect:"Muestra el RD y los Export/Import VPN route-target communities. Verifica que estén cruzados."}]
 },
 { id:"3.2", title:"Asociar la VRF a la interfaz hacia el CE",
   focus:["PE1","PE3","CE1","CE4"], links:[["CE1","PE1"],["PE3","CE4"]], overlays:[],
   lead:`<p>La interfaz que mira al cliente se mete en la VRF. Desde ese momento su red ya no está en la tabla global, sino en la tabla de ENARSI.</p>`,
   warn:`<code>ip vrf forwarding</code> <b>borra la IP</b> de la interfaz. Siempre se configura primero la VRF y <u>después</u> la dirección IP.`,
   tip:`La IP de la interfaz del PE debe coincidir con la que el CE usa en su <code>neighbor</code> BGP (CE4 apunta a <code>172.16.34.3</code>, CE1 a <code>172.16.11.2</code>).`,
   blocks:[
    {dev:"PE1",code:`conf t
interface e0/3
 description CE1 - ENARSI 1
 ip vrf forwarding ENARSI
 ip address 172.16.11.2 255.255.255.0
 no shutdown
end`},
    {dev:"PE3",code:`conf t
interface e0/0
 description CE4 - ENARSI 2
 ip vrf forwarding ENARSI
 ip address 172.16.34.3 255.255.255.0
 no shutdown
end`}],
   verify:[
    {dev:"PE1",cmd:"show ip route vrf ENARSI",expect:"C 172.16.11.0/24 is directly connected, Ethernet0/3. (En ‘show ip route’ global ya no aparece.)"},
    {dev:"PE1",cmd:"ping vrf ENARSI 172.16.11.1",expect:"Responde CE1 (si su interfaz ya tiene IP). Un ping normal sin ‘vrf’ falla: es esperado."}]
 },
 { id:"3.3", title:"Sesión iBGP entre PE1 y PE3 (AS 64000)",
   focus:["PE1","PE3","P1","P2"], overlays:["ibgp"],
   lead:`<p>Los PE intercambian las rutas de los clientes por <b>iBGP</b>. Los P no ejecutan BGP: solo conmutan etiquetas (“core sin BGP”).</p>`,
   why:`<code>update-source loopback 0</code>: la sesión sale desde la loopback, que es el destino del LSP. Así el next-hop de las rutas VPN es 11.11.11.11 / 33.33.33.33, que tiene etiqueta LDP en todo el backbone.`,
   blocks:[
    {dev:"PE1",code:`conf t
router bgp 64000
 bgp router-id 11.11.11.11
 neighbor 33.33.33.33 remote-as 64000
 neighbor 33.33.33.33 update-source loopback 0
end`},
    {dev:"PE3",code:`conf t
router bgp 64000
 bgp router-id 33.33.33.33
 neighbor 11.11.11.11 remote-as 64000
 neighbor 11.11.11.11 update-source loopback 0
end`}],
   verify:[{dev:"PE1",cmd:"show ip bgp summary",expect:"Vecino 33.33.33.33 con State/PfxRcd = 0 (número = sesión establecida). Si dice Active/Idle revisa OSPF de la loopback y update-source."}]
 },
 { id:"3.4", title:"Activar la familia VPNv4 (MP-BGP)",
   focus:["PE1","PE3"], overlays:["ibgp"],
   lead:`<p>La sesión iBGP por defecto solo transporta IPv4 global. Para llevar rutas de clientes (con RD, RT y etiqueta VPN) se activa la familia <b>VPNv4</b>.</p>`,
   why:`Los RT viajan como <b>comunidades extendidas</b>. IOS agrega automáticamente <code>send-community extended</code> al activar el vecino en VPNv4; se incluye explícito para que lo veas.`,
   blocks:[
    {dev:"PE1",code:`conf t
router bgp 64000
 address-family vpnv4
  neighbor 33.33.33.33 activate
  neighbor 33.33.33.33 send-community extended
 exit-address-family
end`},
    {dev:"PE3",code:`conf t
router bgp 64000
 address-family vpnv4
  neighbor 11.11.11.11 activate
  neighbor 11.11.11.11 send-community extended
 exit-address-family
end`}],
   verify:[{dev:"PE1",cmd:"show bgp vpnv4 unicast all summary",expect:"Aparece el vecino 33.33.33.33 bajo la familia VPNv4 Unicast y en estado establecido."}]
 },
 { id:"3.5", title:"eBGP PE–CE dentro de la VRF",
   focus:["PE1","PE3","CE1","CE4"], links:[["CE1","PE1"],["PE3","CE4"]], overlays:[],
   lead:`<p>Cada PE forma una sesión <b>eBGP</b> con su CE, pero <u>dentro</u> de la VRF: <code>address-family ipv4 vrf ENARSI</code>.</p>`,
   why:`Lo aprendido del CE entra en la VRF, se exporta con el RT a VPNv4, viaja al otro PE y se importa en su VRF. Luego se anuncia al CE remoto. Ese es todo el ciclo de la VPN L3.`,
   blocks:[
    {dev:"PE1",code:`conf t
router bgp 64000
 address-family ipv4 vrf ENARSI
  neighbor 172.16.11.1 remote-as 65100
  neighbor 172.16.11.1 activate
 exit-address-family
end`},
    {dev:"PE3",code:`conf t
router bgp 64000
 address-family ipv4 vrf ENARSI
  neighbor 172.16.34.4 remote-as 65200
  neighbor 172.16.34.4 activate
 exit-address-family
end`}],
   verify:[{dev:"PE1",cmd:"show bgp vpnv4 unicast vrf ENARSI summary",expect:"Vecino 172.16.11.1 (AS 65100). Estará en Active hasta que configures CE1 en el paso siguiente."}]
 },
 { id:"3.6", title:"Configurar BGP en CE1 (AS 65100) y CE4 (AS 65200)",
   focus:["CE1","CE4","PE1","PE3","PC-ENARSI1","PC-ENARSI2"], links:[["CE1","PE1"],["PE3","CE4"],["PC-ENARSI1","CE1"],["CE4","PC-ENARSI2"]], overlays:[],
   lead:`<p>Los CE no saben nada de MPLS: solo hablan BGP con su PE y anuncian su LAN con <code>network … mask …</code> (la máscara debe coincidir exactamente con la de la interfaz: /28).</p>`,
   blocks:[
    {dev:"CE1",code:`conf t
hostname CE1
interface e0/0
 description LAN ENARSI 1
 ip address 172.16.10.1 255.255.255.240
 no shutdown

    el("rect",{x:-12,y:11,width:24,height:4,rx:1.5,fill:col},g);
  } else if(n.role==="sw"){
    el("path",{d:"M-24,-5 L-17,-14 L27,-14 L20,-5 Z",fill:col},g);
    el("path",{class:"hi",d:"M-24,-5 L-17,-14 L27,-14 L20,-5 Z"},g);
    el("rect",{x:-24,y:-5,width:44,height:16,fill:col},g);
    el("path",{d:"M20,-5 L27,-14 L27,2 L20,11 Z",fill:col},g);
    el("path",{class:"lo",d:"M20,-5 L27,-14 L27,2 L20,11 Z"},g);
    el("path",{class:"ar","marker-end":"url(#arw)",d:"M-14,-11.5 H8"},g);
    el("path",{class:"ar","marker-end":"url(#arw)",d:"M12,-7.5 H-10"},g);
    el("path",{class:"edge",d:"M-24,-5 H20"},g);
  } else {
    el("path",{d:"M-22,-6 V7 A22,8 0 0 0 22,7 V-6 Z",fill:col},g);
    el("path",{class:"lo",d:"M-22,-6 V7 A22,8 0 0 0 22,7 V-6 Z"},g);
    el("ellipse",{cx:0,cy:-6,rx:22,ry:8,fill:col},g);
    el("ellipse",{class:"hi",cx:0,cy:-6,rx:22,ry:8},g);
    // flechas: dos entrando (izq/der) y dos saliendo (arriba/abajo)
    el("path",{class:"ar","marker-end":"url(#arw)",d:"M-17,-6 H-7"},g);
    el("path",{class:"ar","marker-end":"url(#arw)",d:"M17,-6 H7"},g);
    el("path",{class:"ar","marker-end":"url(#arw)",d:"M2,-8 L6,-12.5"},g);
    el("path",{class:"ar","marker-end":"url(#arw)",d:"M-2,-4 L-6,0.5"},g);
    const t=el("text",{x:0,y:4.5,"text-anchor":"middle",style:"font-size:8.5px;font-weight:700;fill:#fff;opacity:.9;font-family:'JetBrains Mono',monospace"},g);
    t.textContent=n.role==="p"?"P":n.role==="pe"?"PE":"CE";
  }
}
function applyFocus(step){
  const nodes=step&&step.focus||[];const links=new Set();
  if(step){
    (step.links||[]).forEach(([a,b])=>links.add(linkId(a,b)));
    if(!step.links) LINKS.forEach(([a,b])=>{if(nodes.includes(a)&&nodes.includes(b))links.add(linkId(a,b))});
  }
  svg.classList.toggle("focus",nodes.length>0);
  svg.querySelectorAll(".node").forEach(n=>{const nm=n.id.slice(2);n.classList.toggle("on",nodes.includes(nm));n.classList.toggle("sel",mode==="dev"&&nm===selDev)});
  svg.querySelectorAll(".link").forEach(l=>l.classList.toggle("on",links.has(l.id)));
  ["ibgp","pw"].forEach(o=>document.getElementById("ov_"+o).classList.toggle("on",!!(step&&(step.overlays||[]).includes(o))));
  const bar=document.getElementById("animBar");
  if(step&&step.anim){bar.hidden=false;document.getElementById("animLbl").textContent=ANIMS[step.anim].label;bar.dataset.anim=step.anim}
  else bar.hidden=true;
  stopAnim();
}
let animRaf=null;
function stopAnim(){if(animRaf)cancelAnimationFrame(animRaf);animRaf=null;document.getElementById("pkt").style.display="none"}
function playAnim(key){
  stopAnim();const A=ANIMS[key];const pkt=document.getElementById("pkt");const txt=pkt.querySelector("text");const rect=pkt.querySelector("rect");
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;const dur=reduce?10:1300,pause=reduce?900:350;
  let i=0,t0=null;pkt.style.display="";document.getElementById("animLbl").textContent=A.explain;
  function frame(ts){
    if(i>=A.hops.length){animRaf=setTimeout(()=>{pkt.style.display="none"},900);return}
    const [a,b,lab]=A.hops[i];const P=NODES[a],Q=NODES[b];
    if(t0===null){t0=ts;txt.textContent=lab;const w=Math.max(40,lab.length*7.2+14);rect.setAttribute("width",w);rect.setAttribute("x",-w/2)}
    let k=Math.min(1,(ts-t0)/dur);const e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
    pkt.setAttribute("transform",`translate(${P.x+(Q.x-P.x)*e},${P.y+(Q.y-P.y)*e-26})`);
    if(ts-t0>=dur+pause){i++;t0=null}
    animRaf=requestAnimationFrame(frame);
  }
  animRaf=requestAnimationFrame(frame);
}

/* =====================================================================
   RENDER
   ===================================================================== */
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const KW=/^(\s*)(conf t|end|exit|exit-address-family|wr|router (ospf|bgp) \d+|interface( range)? [^\n]+|ip vrf \S+|address-family [^\n]+|vlan \d+|ip dhcp pool \S+)$/;
function hlCode(code,hls=[]){
  return code.split("\n").map(line=>{
    if(/^\s*!/.test(line))return `<span class="c">${esc(line)}</span>`;
    let h=esc(line);
    if(KW.test(line))h=`<span class="k">${h}</span>`;
    hls.forEach(s=>{const es=esc(s);if(h.includes(es))h=h.replace(es,`<span class="hl">${es}</span>`)});
    return h;
  }).join("\n");
}
async function copyText(t,btn){
  try{await navigator.clipboard.writeText(t)}catch(e){const ta=document.createElement("textarea");ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand("copy")}catch(_){}ta.remove()}
  const o=btn.textContent;btn.textContent="✓ Copiado";btn.classList.add("ok");setTimeout(()=>{btn.textContent=o;btn.classList.remove("ok")},1400);
}
function devColor(d){return NODES[d]?ROLE_COLOR[NODES[d].role]:"var(--muted)"}
function codeBox(dev,code,hls,title){
  const id="cb"+Math.random().toString(36).slice(2,8);
  return `<div class="codebox"><div class="bar"><span><b>${esc(dev)}</b>${title?" · "+esc(title):""}</span><button class="copy" data-copy="${id}">Copiar</button></div><pre class="code" id="${id}">${hlCode(code,hls)}</pre></div>`;
}
function renderNav(){
  const L=document.getElementById("stepsList");
  L.innerHTML=PHASES.map(p=>`<div class="phase"><div class="phase-h"><span class="dot" style="background:${p.color}"></span>${esc(p.title)}</div>`+
    p.steps.map(s=>{const i=STEPS.findIndex(x=>x.id===s.id);return `<button class="step-link ${done.has(s.id)?"done":""}" data-i="${i}" ${mode==="step"&&i===cur?'aria-current="step"':""}><span class="n">${s.id}</span><span>${esc(s.title)}</span><span class="ck">✓</span></button>`}).join("")+`</div>`).join("");
  L.querySelectorAll(".step-link").forEach(b=>b.onclick=()=>{go(+b.dataset.i);if(innerWidth<=820)document.getElementById("stepsNav").classList.add("collapsed")});
  const pct=Math.round(100*done.size/STEPS.length);document.getElementById("progBar").style.width=pct+"%";
}
function renderStep(){
  const s=STEPS[cur];const m=document.getElementById("main");
  let h=`<div class="card"><div class="eyebrow"><span>${esc(s.phase.title)}</span>·<span>Paso ${s.id} de ${STEPS[STEPS.length-1].id}</span></div>
  <h1 class="step-title">${esc(s.title)}</h1><div class="lead">${s.lead||""}</div>`;
  if(s.why)h+=`<div class="callout why"><b class="t">¿Por qué?</b>${s.why}</div>`;
  if(s.warn)h+=`<div class="callout warn"><b class="t">Importante</b>${s.warn}</div>`;
  if(s.table)h+=`<div class="tablewrap"><table class="t"><tr>${s.table.head.map(x=>`<th>${x}</th>`).join("")}</tr>${s.table.rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</table></div>`;
  if(s.blocks&&s.blocks.length){
    const sel=tabSel[s.id]??0;
    h+=`<h2 class="sec">Configuración (${s.blocks.length} equipo${s.blocks.length>1?"s":""})</h2><div class="devtabs" role="tablist">`+
      s.blocks.map((b,i)=>`<button role="tab" aria-selected="${i===sel}" data-tab="${i}"><span class="sw" style="background:${devColor(b.dev)}"></span>${esc(b.dev)}</button>`).join("")+`</div>`;
    const b=s.blocks[sel];h+=codeBox(b.dev,b.code,b.hl);
    if(s.note)h+=`<p class="blocknote">ℹ ${esc(s.note)}</p>`;
  }
  if(s.extraHtml)h+=s.extraHtml;
  if(s.tip)h+=`<div class="callout tip"><b class="t">Tip</b>${s.tip}</div>`;
  if(s.verify&&s.verify.length){
    h+=`<h2 class="sec">Verificación</h2>`+s.verify.map(v=>{const id="v"+Math.random().toString(36).slice(2,8);return `<div class="verify"><div class="vh"><span class="dev">${esc(v.dev)}</span><code id="${id}">${esc(v.cmd)}</code><button class="copy" data-copy="${id}">Copiar</button></div><div class="vb">✔ ${esc(v.expect)}${v.out?`<details><summary>Ver salida de ejemplo</summary><pre>${esc(v.out)}</pre></details>`:""}</div></div>`}).join("");
  }
  const isDone=done.has(s.id);
  h+=`<div class="navbtns"><button class="btn" id="prevB" ${cur===0?"disabled":""}>← Anterior</button>
  <button class="btn ${isDone?"done":""}" id="doneB">${isDone?"✓ Completado":"Marcar como completado"}</button>
  <button class="btn primary" id="nextB" ${cur===STEPS.length-1?"disabled":""}>Siguiente →</button></div><p class="kbd">Atajos: ← → para navegar · C para marcar completado</p></div>`;
  m.innerHTML=h;
  m.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{tabSel[s.id]=+b.dataset.tab;renderStep()});
  m.querySelector("#prevB").onclick=()=>go(cur-1);
  m.querySelector("#nextB").onclick=()=>{if(!done.has(s.id)){done.add(s.id);store.set("done",[...done])}go(cur+1)};
  m.querySelector("#doneB").onclick=toggleDone;
  bindCopy(m);applyFocus(s);
}
function renderDevice(){
  const devs=[...new Set(STEPS.flatMap(s=>(s.blocks||[]).map(b=>b.dev)))];
  if(!devs.includes(selDev))selDev=devs[0];
  const m=document.getElementById("main");
  const secs=STEPS.filter(s=>(s.blocks||[]).some(b=>b.dev===selDev));
  const all=secs.map(s=>`! ===== Paso ${s.id}: ${s.title} =====\n`+s.blocks.filter(b=>b.dev===selDev).map(b=>b.code).join("\n")).join("\n\n");
  let h=`<div class="card"><div class="eyebrow"><span>Vista por equipo</span>${NODES[selDev]?`· <span class="mono">${esc(NODES[selDev].info)}</span>`:""}</div>
  <h1 class="step-title">Configuración de ${esc(selDev)}</h1>
  <div class="devpick">${devs.map(d=>`<button aria-pressed="${d===selDev}" data-dev="${esc(d)}">${esc(d)}</button>`).join("")}</div>`;
  if(!secs.length)h+=`<p>Este equipo no requiere configuración en esta guía.</p>`;
  else{
    h+=`<p class="blocknote" style="margin-bottom:12px">${secs.length} paso(s) involucran a ${esc(selDev)}. Puedes copiar todo de una vez o ir bloque por bloque.</p>`;
    h+=`<details style="margin-bottom:16px"><summary style="cursor:pointer;color:var(--accent);font-weight:600">Ver / copiar configuración completa en un solo bloque</summary><div style="margin-top:8px">${codeBox(selDev,all,[],"todos los pasos")}</div></details>`;
    secs.forEach(s=>{const i=STEPS.indexOf(s);s.blocks.filter(b=>b.dev===selDev).forEach(b=>{
      h+=`<div class="devsec"><h3><span class="chip">${s.id}</span>${esc(s.title)} <a href="#paso-${s.id}" data-goto="${i}">ir al paso →</a></h3>${codeBox(selDev,b.code,b.hl)}</div>`})});
  }
  h+=`</div>`;m.innerHTML=h;
  m.querySelectorAll("[data-dev]").forEach(b=>b.onclick=()=>{selDev=b.dataset.dev;renderDevice()});
  m.querySelectorAll("[data-goto]").forEach(a=>a.onclick=e=>{e.preventDefault();setMode("step");go(+a.dataset.goto)});
  bindCopy(m);
  applyFocus({focus:NODES[selDev]?[selDev]:[],overlays:[]});
}
function bindCopy(root){root.querySelectorAll("[data-copy]").forEach(b=>b.onclick=()=>copyText(document.getElementById(b.dataset.copy).innerText,b))}
function toggleDone(){const s=STEPS[cur];done.has(s.id)?done.delete(s.id):done.add(s.id);store.set("done",[...done]);renderNav();renderStep()}
function go(i){if(i<0||i>=STEPS.length)return;cur=i;store.set("cur",cur);if(mode!=="step"){mode="step";syncModeBtns()}history.replaceState(null,"","#paso-"+STEPS[cur].id);renderNav();renderStep();window.scrollTo({top:0,behavior:"smooth"})}
function syncModeBtns(){document.getElementById("mStep").setAttribute("aria-pressed",mode==="step");document.getElementById("mDev").setAttribute("aria-pressed",mode==="dev")}
function setMode(md){mode=md;syncModeBtns();renderNav();if(mode==="step")renderStep();else{history.replaceState(null,"","#equipo-"+selDev);renderDevice();window.scrollTo({top:0,behavior:"smooth"})}}

/* =====================================================================
   INIT
   ===================================================================== */
buildTopo();
document.getElementById("mStep").onclick=()=>setMode("step");
document.getElementById("mDev").onclick=()=>setMode("dev");
document.getElementById("playBtn").onclick=()=>playAnim(document.getElementById("animBar").dataset.anim);
const bigBtn=document.getElementById("bigBtn"),aside=document.querySelector("aside.topo");let bd=null;
function setBig(on){aside.classList.toggle("big",on);bigBtn.textContent=on?"✕ Cerrar":"⤢ Ampliar";if(on){bd=document.createElement("div");bd.className="backdrop";bd.onclick=()=>setBig(false);document.body.appendChild(bd)}else if(bd){bd.remove();bd=null}}
bigBtn.onclick=()=>setBig(!aside.classList.contains("big"));
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&aside.classList.contains("big"))setBig(false)});
document.getElementById("navToggle").onclick=()=>document.getElementById("stepsNav").classList.toggle("collapsed");
if(innerWidth<=820)document.getElementById("stepsNav").classList.add("collapsed");
document.getElementById("resetBtn").onclick=()=>{done=new Set();store.set("done",[]);renderNav();if(mode==="step")renderStep()};
const root=document.documentElement;const savedTheme=store.get("theme",null);if(savedTheme)root.dataset.theme=savedTheme;
document.getElementById("themeBtn").onclick=()=>{const dark=root.dataset.theme?root.dataset.theme==="dark":matchMedia("(prefers-color-scheme: dark)").matches;root.dataset.theme=dark?"light":"dark";store.set("theme",root.dataset.theme)};
document.addEventListener("keydown",e=>{
  if(e.target.closest("input,textarea")||e.ctrlKey||e.metaKey||e.altKey)return;
  if(mode!=="step")return;
  if(e.key==="ArrowRight")go(cur+1);else if(e.key==="ArrowLeft")go(cur-1);else if(e.key.toLowerCase()==="c")toggleDone();
});
(function start(){
  const h=decodeURIComponent(location.hash);
  let m=h.match(/^#paso-(.+)$/);
  if(m){const i=STEPS.findIndex(s=>s.id===m[1]);if(i>=0)cur=i}
  else if((m=h.match(/^#equipo-(.+)$/))&&NODES[m[1]]){selDev=m[1];setMode("dev");return}
  else cur=Math.min(store.get("cur",0),STEPS.length-1);
  renderNav();renderStep();
})();
</script>
